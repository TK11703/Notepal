name: CI/CD

# build-test runs for every push and pull request. On main (push or manual run), the preview job then shows an
# infrastructure what-if, and the deploy job uses the 'production' environment, so it waits for a required reviewer
# to approve before anything in Azure changes.
#
# Required configuration (Settings > Secrets and variables > Actions, and Settings > Environments):
#   environment: production, with required reviewers
#   production secret:    POSTGRES_ADMIN_PASSWORD (environment only; the preview uses a throwaway value)
#   repository secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   repository variables: AZURE_RESOURCE_GROUP, AZURE_LOCATION, NOTEPAL_API_CLIENT_ID, NOTEPAL_WEB_CLIENT_ID
#                         (optional) AZURE_REGISTRY_NAME, AZURE_REGISTRY_RESOURCE_GROUP (defaults in infra/main.bicep)
#   (repository level, not environment level: the preview job runs outside the production environment)
#   federated credentials on the AZURE_CLIENT_ID app: subjects 'repo:<owner>@<owner-id>/<repo>@<repo-id>:ref:refs/heads/main'
#                (preview) and 'repo:<owner>@<owner-id>/<repo>@<repo-id>:environment:production' (deploy)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  API_CLIENT_ID: ${{ vars.NOTEPAL_API_CLIENT_ID }}
  WEB_CLIENT_ID: ${{ vars.NOTEPAL_WEB_CLIENT_ID }}
  REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME || 'acracccommon' }}
  REGISTRY_RG: ${{ vars.AZURE_REGISTRY_RESOURCE_GROUP || 'rg-common' }}
  TAG: ${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Notepal.slnx

      - name: Build
        run: dotnet build Notepal.slnx --no-restore -c Release

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test Notepal.slnx --no-build -c Release

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  preview:
    needs: build-test
    # Only main of this repository (never pull requests, including from forks).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          echo "### Deployment preview for \`${TAG:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$(az group exists --name "$RG")" != "true" ]; then
            echo "Resource group \`$RG\` doesn't exist yet: everything will be created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          params=(location="$LOCATION" apiClientId="$API_CLIENT_ID" webClientId="$WEB_CLIENT_ID"
                  postgresAdminPassword="$(openssl rand -base64 32)" # secure values aren't compared by what-if
                  registryName="$REGISTRY_NAME" registryResourceGroup="$REGISTRY_RG")
          login_server=$(az acr show --name "$REGISTRY_NAME" --resource-group "$REGISTRY_RG" --query loginServer --output tsv)
          params+=(apiImage="$login_server/notepal-api:$TAG" webImage="$login_server/notepal-web:$TAG")

          status=0
          az deployment group what-if \
            --resource-group "$RG" \
            --template-file infra/main.bicep \
            --parameters "${params[@]}" \
            --exclude-change-types NoChange Ignore > what-if.txt 2>&1 || status=$?
          cat what-if.txt
          {
            echo '```'
            cat what-if.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  deploy:
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Runs waiting for approval are replaced by newer ones; a running deployment is never cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.apps.outputs.webUrl }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # An existing group keeps its region; resources are placed by the template's location parameter.
      - name: Create resource group
        run: |
          if [ "$(az group exists --name "$RG")" != "true" ]; then
            az group create --name "$RG" --location "$LOCATION" --output none
          fi

      - name: Deploy shared infrastructure
        id: infra
        env:
          PG_ADMIN_SECRET: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name notepal-infra \
            --template-file infra/main.bicep \
            --parameters location="$LOCATION" apiClientId="$API_CLIENT_ID" webClientId="$WEB_CLIENT_ID" \
                         postgresAdminPassword="$PG_ADMIN_SECRET" \
                         registryName="$REGISTRY_NAME" registryResourceGroup="$REGISTRY_RG" \
            --no-wait
          bash infra/scripts/watch-deployment.sh "$RG" notepal-infra
          registry=$(az deployment group show --resource-group "$RG" --name notepal-infra --query properties.outputs.registryName.value --output tsv)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "loginServer=$(az acr show --name "$registry" --resource-group "$REGISTRY_RG" --query loginServer --output tsv)" >> "$GITHUB_OUTPUT"

      - name: Build API image
        env:
          REGISTRY: ${{ steps.infra.outputs.registry }}
        run: az acr build --registry "$REGISTRY" --resource-group "$REGISTRY_RG" --image "notepal-api:$TAG" --file src/Notepal.Api/Dockerfile . --output none

      - name: Build web image
        env:
          REGISTRY: ${{ steps.infra.outputs.registry }}
        run: az acr build --registry "$REGISTRY" --resource-group "$REGISTRY_RG" --image "notepal-web:$TAG" --file src/Notepal.Web/Dockerfile . --output none

      - name: Deploy container apps
        id: apps
        env:
          PG_ADMIN_SECRET: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          LOGIN_SERVER: ${{ steps.infra.outputs.loginServer }}
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name notepal-apps \
            --template-file infra/main.bicep \
            --parameters location="$LOCATION" apiClientId="$API_CLIENT_ID" webClientId="$WEB_CLIENT_ID" \
                         postgresAdminPassword="$PG_ADMIN_SECRET" \
                         registryName="$REGISTRY_NAME" registryResourceGroup="$REGISTRY_RG" \
                         apiImage="$LOGIN_SERVER/notepal-api:$TAG" \
                         webImage="$LOGIN_SERVER/notepal-web:$TAG" \
            --no-wait
          bash infra/scripts/watch-deployment.sh "$RG" notepal-apps
          outputs=$(az deployment group show --resource-group "$RG" --name notepal-apps --query properties.outputs --output json)
          web_url=$(echo "$outputs" | jq -r .webUrl.value)
          principal=$(echo "$outputs" | jq -r .webIdentityPrincipalId.value)
          echo "webUrl=$web_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Notepal deployed"
            echo "Web app: $web_url"
            echo
            echo "First deployment? Finish the Entra setup once with:"
            echo '```'
            echo "./infra/scripts/setup-entra.ps1 finalize $web_url $principal"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
