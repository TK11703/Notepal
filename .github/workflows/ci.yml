name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Notepal.slnx

      - name: Build
        run: dotnet build Notepal.slnx --no-restore -c Release

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test Notepal.slnx --no-build -c Release

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
