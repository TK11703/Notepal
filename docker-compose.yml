# Local development database: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notepal
      POSTGRES_PASSWORD: notepal
      POSTGRES_DB: notepal
    ports:
      - "5432:5432"
    volumes:
      - notepal-data:/var/lib/postgresql/data

volumes:
  notepal-data:
